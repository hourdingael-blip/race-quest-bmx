function figure(pose,coach){let limbs={warm:'<g class="arms"><path d="M135 102 L99 77 M165 102 L203 77"/></g><path d="M150 156 L131 207 M150 156 L174 207"/>',squat:'<path d="M136 103 L105 135 M164 103 L194 135 M150 156 L117 172 L111 210 M150 156 L181 172 L188 210"/>',balance:'<path d="M137 104 L111 130 M163 104 L187 130 M149 157 L138 214 M153 157 L183 183 L197 171"/>',plank:'<path d="M115 150 L72 154 L60 207 M170 150 L215 157 L241 207"/>',lunge:'<path d="M136 104 L103 129 M164 104 L194 129 M150 157 L117 175 L113 211 M150 157 L189 174 L222 194"/>',side:'<path d="M134 105 L105 130 M164 105 L194 130 M149 157 L119 205 M152 157 L183 205"/>',rest:'<path d="M136 104 L116 151 M164 104 L183 151 M149 157 L130 205 M152 157 L172 205"/>'};const shape=limbs[pose]||limbs.rest;let flat=pose==='plank';return '<svg class="demo-svg" viewBox="0 0 300 230" role="img" aria-label="Démonstration animée : '+safe(pose)+'"><ellipse cx="150" cy="218" rx="115" ry="9" fill="#fff" opacity=".09"/><g class="'+(pose==='warm'?'':pose)+'" '+(flat?'transform="rotate(73 150 150)"':'')+'><g stroke="'+coach.base+'" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round">'+shape+'<path d="M150 96 L150 156"/></g><rect x="129" y="85" width="42" height="69" rx="18" fill="'+coach.base+'" stroke="#172437" stroke-width="5"/><circle cx="150" cy="61" r="30" fill="'+coach.base+'" stroke="#172437" stroke-width="5"/><rect x="129" y="51" width="42" height="23" rx="11" fill="#182840"/><circle cx="140" cy="62" r="6" fill="#bcfa67"/><circle cx="160" cy="62" r="6" fill="#bcfa67"/><path d="M145 72 Q150 75 155 72" stroke="#bcfa67" stroke-width="2.5" fill="none"/></g><text x="150" y="226" text-anchor="middle" font-size="10" fill="#b7cce2">Démonstration simplifiée • sans matériel</text></svg>'}
function unlockSound(){voiceUnlocked=true;try{if(window.speechSynthesis){const x=new SpeechSynthesisUtterance('');x.volume=0;x.lang='fr-FR';speechSynthesis.speak(x)}}catch(e){}}
function speak(msg){lastSpoken=msg;if(!state.volume||!voiceUnlocked)return;try{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(msg);u.lang='fr-FR';let c=activeCoach();u.pitch=c.pitch;u.rate=c.rate;u.volume=1;const voices=window.speechSynthesis.getVoices();const fr=voices.find(v=>v.lang.toLowerCase().startsWith('fr'));if(fr)u.voice=fr;window.speechSynthesis.speak(u);$('.coachbig')?.classList.add('speaking');u.onend=()=>$('.coachbig')?.classList.remove('speaking')}catch(e){}}
function silence(){try{speechSynthesis.cancel()}catch(e){}$('.coachbig')?.classList.remove('speaking')}
function stopTimer(){if(timer)clearInterval(timer);timer=null;running=false;silence()}
function setPage(p){stopTimer();page=p;$$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.page===p));render()}
function setWorldTheme(i){let w=worlds[i]||worlds[0];document.documentElement.style.setProperty('--world',w.a);document.documentElement.style.setProperty('--world2',w.b)}
function worldArt(i){let w=worlds[i];return '<svg class="world-art" viewBox="0 0 200 210"><circle cx="115" cy="75" r="68" fill="#fff" opacity=".17"/><text x="102" y="135" font-size="97" text-anchor="middle">'+w.emoji+'</text><path d="M25 189 Q100 135 180 190" fill="none" stroke="#ffffff99" stroke-width="10" stroke-linecap="round"/></svg>'}
function worldUnlocked(i){return state.completed>=i*6}
function mapScreen(){const w=worlds[state.chosenWorld];setWorldTheme(state.chosenWorld);let positions=[[50,408],[25,344],[70,284],[31,217],[72,151],[47,83]];const path='M 50 408 Q 10 380 25 344 Q 35 315 70 284 Q 75 240 31 217 Q 20 170 72 151 Q 70 105 47 83';let current=Math.min(5,Math.max(0,state.completed-state.chosenWorld*6));const thisWorldDone=Math.max(0,Math.min(6,state.completed-state.chosenWorld*6));let runnerIndex=Math.min(5,current);let items=positions.map(([x,y],idx)=>{let ok=state.chosenWorld*6+idx<state.completed,open=state.chosenWorld*6+idx===state.completed;return '<button style="left:'+x+'%;top:'+y+'px" class="node '+(ok?'done':open?'current':'locked')+'" data-node="'+idx+'" aria-label="Niveau '+(state.chosenWorld*6+idx+1)+'">'+(ok?'✓':open?'▶':'🔒')+'<span class="stepnum">Niv. '+(state.chosenWorld*6+idx+1)+'</span></button>'}).join('');return `<div class="gap"><div class="row"><div><h1>La carte des mondes</h1><p class="small">Avance d'étape en étape en t'entraînant.</p></div><div class="tag">${state.completed}/36 ⭐</div></div><div class="worldselect">${worlds.map((x,i)=>`<button data-world="${i}" class="worldchip ${state.chosenWorld===i?'active':''} ${worldUnlocked(i)?'':'locked'}">${x.emoji} ${x.name} ${worldUnlocked(i)?'':'🔒'}</button>`).join('')}</div><div class="worldhero"><div class="eyebrow" style="color:#fff">MONDE ${state.chosenWorld+1} / 6</div><h1>${w.name}</h1><p>${w.desc}</p>${worldArt(state.chosenWorld)}<button class="btn secondary" data-trailer="${state.chosenWorld}" style="position:relative;z-index:4;margin-top:19px">▶ Voir l’intro du monde</button></div><div class="map"><div class="land"></div><svg class="path" viewBox="0 0 100 465" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#fff" opacity=".65" stroke-width="3" stroke-dasharray="4 7" stroke-linecap="round"/></svg><div class="nodes">${items}</div><div class="runner" style="left:${positions[runnerIndex][0]}%;top:${positions[runnerIndex][1]-23}px">${runnerSVG()}</div></div><div class="card gap"><div class="row"><h3>Bandes-annonces des mondes</h3><span class="tag">6 univers</span></div><p class="small">Regarde les introductions animées, même si les niveaux restent verrouillés.</p><div class="worldselect">${worlds.map((x,i)=>`<button class="worldchip" data-trailer="${i}">${x.emoji} ▶ ${x.name}</button>`).join('')}</div><img src="./concept-map.png" alt="Illustration panoramique des six mondes et du parcours des 36 niveaux" loading="lazy" style="width:100%;border-radius:15px;display:block"/></div><div class="card gap"><div class="row"><b>Progression du monde</b><b>${thisWorldDone}/6</b></div><div class="meter"><div style="width:${thisWorldDone/6*100}%"></div></div><p class="small">Termine une séance adaptée pour faire avancer ton personnage. Les récompenses physiques sont limitées pour protéger ta récupération.</p><button class="btn full" id="startMap">${state.completed===36?'Explorer mes mondes':'Commencer le prochain défi'}</button></div></div>`}
function weeklyCount(){let d=new Date();let day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);const monday=d.toISOString().slice(0,10);return state.sessions.filter(s=>s.date>=monday&&s.kind==='training').length}
function dateToday(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayClub(){return state.clubDays.includes((new Date().getDay()+6)%7)}
function daysUntilCompetition(){if(!state.competition)return null;let date=new Date(state.competition+'T12:00:00');return Math.ceil((date-new Date())/86400000)}
function trainingScreen(){let days=daysUntilCompetition(),weekly=weeklyCount(),club=dayClub(),prep=days!==null&&days>=0&&days<=7;return `<div class="gap"><div><h1>Choisis ta séance</h1><p class="small">Dans ta chambre, sans matériel, 20 minutes maximum.</p></div>${prep?'<div class="warning">🏁 Course dans '+days+' jour(s) : cette semaine, on privilégie la récupération et la qualité des mouvements. Pas de surcharge.</div>':''}${club?'<div class="warning">🚴 Aujourd’hui tu as BMX en club. Pas besoin de préparation physique supplémentaire.</div>':''}<div class="card gap"><div class="row"><h2>⚡ Défi du jour</h2><span class="tag">8–12 min</span></div><p>Échauffement, équilibre, coordination et gainage. Les exercices changent selon le niveau.</p><div class="row"><span class="small">${weekly}/2 séances supplémentaires cette semaine</span><span class="tag">+45 XP · +35 🪙</span></div><button class="btn full" data-start="training" ${weekly>=2||club||prep?'disabled':''}>${club?'Jour de club':prep?'Préparation allégée':weekly>=2?'Maximum atteint':'Démarrer avec mon coach'}</button></div><div class="card gap"><div class="row"><h2>🌱 Mobilité douce</h2><span class="tag">3 min</span></div><p>Mobilité sur place et respiration : idéale les jours de BMX ou de récupération.</p><button class="btn secondary full" data-start="recovery">Démarrer la récupération</button></div><div class="card gap"><h3>Ton coach actuel</h3><div class="row"><div class="coachbig">${face(activeCoach())}</div><div style="flex:1"><b>${activeCoach().name}</b><p class="small">Il annonce les exercices automatiquement, après ton premier appui sur Démarrer.</p></div></div></div><p class="note">Les exercices animés sont des démonstrations simplifiées. En cas de douleur, arrête. Le BMX en club reste prioritaire.</p></div>`}
function startSession(kind){stopTimer();unlockSound();sessionKind=kind;skipped=false;selectedSeq=kind==='recovery'?['warm','mobility','rest','balance','mobility']:(()=>{const base=sequencePool[Math.min(5,state.completed%6)];return [base[0],...base.slice(1,-1),...base.slice(1,-1),...base.slice(1,-1),base.at(-1)]})();index=0;remaining=exercises[selectedSeq[0]].seconds;page='exercise';render();startTimer()}
function currentExercise(){return exercises[selectedSeq[index]]}
function sessionScreen(){let e=currentExercise(),c=activeCoach();return `<div class="gap"><div class="row"><button class="btn ghost" id="quit">← Quitter</button><span class="tag">Exercice ${index+1}/${selectedSeq.length}</span></div><div><h1>${e.title}</h1><p>${e.info}</p></div><div class="exercise-view"><div class="coach-speech" id="speechBubble">🤖 ${c.name} : ${safe(e.cue)}</div>${figure(e.pose,c)}<div class="row" style="width:100%;padding:0 15px 12px"><span class="tag">Coach : ${c.name}</span><div class="coachbig" style="width:54px;height:60px">${face(c,55)}</div></div></div><div class="card gap"><div class="clock ${running?'active':''}" id="clock">${format(remaining)}</div><div class="progress-bar"><div id="timeProgress" style="width:${(1-remaining/e.seconds)*100}%"></div></div><div class="row"><button class="btn ${running?'secondary':''}" id="play" style="flex:1">${running?'⏸ Pause':'▶ '+(remaining===e.seconds?'Démarrer':'Reprendre')}</button><button class="btn outline" id="next" style="flex:1">${index===selectedSeq.length-1?'Terminer ✓':'Suivant →'}</button></div><p class="small" style="text-align:center">🔊 La voix parle automatiquement • <button id="repeatVoice" style="color:#c7fc54;background:none;border:0;font-weight:900">Répéter la consigne</button></p></div></div>`}
function format(n){return Math.floor(n/60).toString().padStart(2,'0')+':'+(n%60).toString().padStart(2,'0')}
function updateClock(){let e=currentExercise();if($('#clock'))$('#clock').textContent=format(remaining);if($('#timeProgress'))$('#timeProgress').style.width=(100*(1-remaining/e.seconds))+'%'}
function startTimer(){if(running)return;unlockSound();running=true;speak(currentExercise().cue);let last=Date.now();timer=setInterval(()=>{let now=Date.now(),elapsed=Math.floor((now-last)/1000);if(elapsed<1)return;last+=elapsed*1000;remaining=Math.max(0,remaining-elapsed);updateClock();if(remaining<=0){stopTimer();if(index<selectedSeq.length-1){index++;remaining=currentExercise().seconds;render();speak('Exercice suivant : '+currentExercise().title+'. '+currentExercise().cue);startTimerSilent()}else finishSession()}else if(remaining<=5&&remaining+elapsed>5){speak('Encore cinq secondes')}},350);render()}
function startTimerSilent(){if(running)return;running=true;let last=Date.now();timer=setInterval(()=>{let now=Date.now(),elapsed=Math.floor((now-last)/1000);if(elapsed<1)return;last+=elapsed*1000;remaining=Math.max(0,remaining-elapsed);updateClock();if(remaining<=0){stopTimer();if(index<selectedSeq.length-1){index++;remaining=currentExercise().seconds;render();speak('Exercice suivant : '+currentExercise().title+'. '+currentExercise().cue);startTimerSilent()}else finishSession()}else if(remaining<=5&&remaining+elapsed>5){speak('Encore cinq secondes')}},350);const b=$('#play');if(b)b.textContent='⏸ Pause';$('#clock')?.classList.add('active')}
function nextExercise(){if(remaining>0)skipped=true;stopTimer();if(index<selectedSeq.length-1){index++;remaining=currentExercise().seconds;render();speak('Exercice suivant. '+currentExercise().cue)}else finishSession()}
function finishSession(){stopTimer();let today=dateToday(),key=sessionKind+'-'+today,eligible=!skipped&&!state.earnedDays[key]&&(sessionKind==='recovery'||weeklyCount()<2),xpGain=0,coinsGain=0;if(eligible){xpGain=sessionKind==='training'?45:10;coinsGain=sessionKind==='training'?35:5;state.earnedDays[key]=true;state.xp+=xpGain;state.coins+=coinsGain;if(sessionKind==='training'){state.completed=Math.min(36,state.completed+1);if(state.completed%6===0){state.coins+=60;coinsGain+=60;state.chosenWorld=Math.min(5,Math.floor(state.completed/6))}}state.sessions.push({date:today,kind:sessionKind})}save();alertText=eligible?`+${xpGain} XP · +${coinsGain} pièces`:(skipped?'Démo parcourue trop vite : pas de récompense. Termine les chronos pour valider.':'Déjà validée aujourd’hui · pas de récompense supplémentaire');page='finish';render();speak('Bravo ! Séance terminée. Prends le temps de récupérer.');if(eligible&&sessionKind==='training'&&state.completed>0&&state.completed%6===0&&state.completed<36){const target=state.completed/6;setTimeout(()=>showCinema(target,true),1800)}}
function finishScreen(){return `<div class="gap" style="padding-top:25px;text-align:center"><div class="celebrate">🏆</div><h1>Bravo, défi réussi !</h1><p>Ton coach est fier de toi. La récupération fait aussi partie de la progression.</p><div class="card"><h2 style="color:#c7fc54">${alertText}</h2><p class="small">Ton personnage avance sur le parcours après les séances validées.</p></div><button class="btn full" id="backMap">Voir ma carte 🗺️</button><button class="btn secondary full" id="backTrain">Mes séances</button></div>`}
function passScreen(){let current=Math.min(18,Math.floor(state.xp/80));return `<div class="gap"><div><div class="eyebrow">RÉCOMPENSES GRATUITES</div><h1>Pass des champions 🏆</h1><p>Pas de paiement, pas d'achat réel : tu avances en faisant tes séances.</p></div><div class="card gap"><div class="row"><b>Ta progression</b><b>${state.xp} XP</b></div><div class="meter"><div style="width:${(state.xp%80)/80*100}%"></div></div><p class="small">Palier ${current+1} · ${state.xp%80}/80 XP vers la récompense suivante</p></div><div class="pass-track">${Array.from({length:18},(_,i)=>`<div class="passstep ${state.xp>=(i+1)*80?'unlocked':''}"><div style="font-size:29px">${i%4===3?'🎁':i%4===2?'⚡':i%4===1?'🎖️':'🪙'}</div><b>Palier ${i+1}</b><div class="small">${(i+1)*80} XP</div><div class="small">${state.xp>=(i+1)*80?'✓ Débloqué':'🔒 À atteindre'}</div></div>`).join('')}</div><div class="card gap"><h3>Comment gagner des récompenses ?</h3><p>Une séance de renforcement validée : 45 XP et 35 pièces. Une récupération guidée : 10 XP et 5 pièces. Après six défis, tu reçois 60 pièces supplémentaires et tu accèdes au monde suivant.</p><div class="warning">Les récompenses sont limitées à une fois par jour par type de séance, et à deux renforcements par semaine. L'objectif est de progresser, pas de s'entraîner trop.</div></div></div>`}
function shopScreen(){return `<div class="gap"><div><h1>Boutique des coachs</h1><p>Choisis ton personnage : il te montre les mouvements et te parle pendant les séances.</p></div><div class="card row"><b>Ton portefeuille</b><h2>🪙 ${state.coins}</h2></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px">${coaches.map(c=>`<div class="coach-item ${state.owned.includes(c.id)?'owned':''}"><div class="coach-face">${face(c,95)}</div><h3>${c.name}</h3><p class="small">${c.desc}</p><div class="price">${c.cost===0?'Gratuit':'🪙 '+c.cost}</div><button class="btn ${state.coach===c.id?'secondary':state.owned.includes(c.id)?'':'outline'}" data-coach="${c.id}">${state.coach===c.id?'✓ Équipé':state.owned.includes(c.id)?'Choisir':'Débloquer'}</button></div>`).join('')}</div>${alertText?'<p class="warning">'+safe(alertText)+'</p>':''}<p class="note">Les coachs sont des personnages originaux. Leur voix utilise la synthèse vocale disponible sur ton appareil, sans imiter un acteur.</p></div>`}
function profileScreen(){let days=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];return `<div class="gap"><div><h1>Mon espace</h1><p>Personnalise ton planning. Tout reste sur cet appareil.</p></div><div class="row"><div class="stat" style="flex:1"><h2>${state.completed}</h2><p class="small">Défis validés</p></div><div class="stat" style="flex:1"><h2>${state.xp}</h2><p class="small">Expérience</p></div><div class="stat" style="flex:1"><h2>${state.owned.length}</h2><p class="small">Coachs</p></div></div><div class="card gap"><h3>Mes 4 jours de BMX en club</h3><p class="small">Choisis les jours de tes entraînements de 1 h 30.</p><div class="days">${days.map((d,i)=>`<button class="day ${state.clubDays.includes(i)?'selected':''}" data-day="${i}">${d}</button>`).join('')}</div><p class="small" id="dayNotice">${state.clubDays.length}/4 jours sélectionnés</p></div><div class="card gap"><h3>Ma prochaine compétition</h3><input type="date" id="competition" value="${safe(state.competition)}" aria-label="Date de prochaine compétition"><p class="small">La semaine avant une course, l'application évite le renforcement supplémentaire pour réduire la fatigue. Un entraîneur peut te conseiller pour la préparation.</p></div><div class="card gap"><div class="row"><div><h3>Voix du coach</h3><p class="small">Consignes automatiques pendant la séance</p></div><button class="btn secondary" id="sound">${state.volume?'🔊 Activée':'🔇 Coupée'}</button></div><button class="btn outline full" id="voiceTest">Tester la voix</button></div><div class="card gap"><h3>Mes dernières séances</h3>${state.sessions.length?state.sessions.slice(-8).reverse().map(s=>`<div class="row"><span>${s.kind==='training'?'⚡ Entraînement':'🌱 Récupération'}</span><span class="small">${s.date}</span></div>`).join(''):'<p class="small">Aucune séance enregistrée pour le moment.</p>'}</div><p class="note">Aucun compte requis, aucun suivi en ligne, aucune vidéo envoyée. Les données sont enregistrées localement. Ne supprime pas les données de ce site pour conserver tes progrès.</p></div>`}

];
function sceneHTML(i){const w=worlds[i],v=scenes[i];return `<div class="cine-scene ${v.cls}" style="--cc1:${v.color1};--cc2:${v.color2};--land:${v.land};--road:${v.road}"><div class="cine-sky"></div><div class="cine-moon"></div><div class="cine-confetti"></div><div class="cine-horizon"></div><div class="cine-decor">${v.items.map((x,n)=>`<span class="cine-thing t${n+1}">${x}</span>`).join('')}</div><div class="cine-road"></div><div class="cine-character">${runnerSVG()}</div></div><div class="cine-ui"><div class="cine-top"><span class="cine-chip">MONDE ${i+1} / 6</span><button id="cineSkip" class="cine-skip">Passer →</button></div><div class="cine-bottom"><div class="cine-chip" style="display:inline-block;margin-bottom:13px">${v.tag}</div><h2>${w.emoji} ${w.name}</h2><p>${v.story}</p><div class="cine-bar"><div id="cineProgress"></div></div><button id="cineGo" class="btn cine-go">Explorer ce monde →</button></div></div>`}
function closeCinema(){if(cinemaTimer)clearTimeout(cinemaTimer);if(cinemaInterval)clearInterval(cinemaInterval);cinemaTimer=null;cinemaInterval=null;$('#cinematic').classList.remove('on');$('#cinematic').innerHTML='';cinemaNextWorld=null;silence()}
function enterWorld(i){const apply=cinemaNextWorld===i&&worldUnlocked(i);closeCinema();if(apply){state.chosenWorld=i;save()}setPage('map')}
function showCinema(i,travel=false){if(i<0||i>=worlds.length)return;closeCinema();stopTimer();cinemaNextWorld=travel?i:null;const modal=$('#cinematic');modal.innerHTML=sceneHTML(i);modal.classList.add('on');$('#cineSkip').onclick=()=>enterWorld(i);$('#cineGo').onclick=()=>enterWorld(i);const timeStart=Date.now(),total=7000;cinemaInterval=setInterval(()=>{const percent=Math.min(100,Math.round((Date.now()-timeStart)/total*100));const bar=$('#cineProgress');if(bar)bar.style.width=percent+'%';if(percent>=100)enterWorld(i)},100);unlockSound();speak('Bienvenue dans '+worlds[i].name+'. '+scenes[i].story)}

function render(){updateHeader();$('#screen').innerHTML=page==='map'?mapScreen():page==='train'?trainingScreen():page==='exercise'?sessionScreen():page==='finish'?finishScreen():page==='pass'?passScreen():page==='shop'?shopScreen():profileScreen();bind()}
function bind(){ $$('[data-trailer]').forEach(b=>b.onclick=()=>showCinema(Number(b.dataset.trailer),false)); $$('[data-world]').forEach(b=>b.onclick=()=>{let i=+b.dataset.world;if(worldUnlocked(i)){state.chosenWorld=i;save();render()}else{alert('Ce monde se débloque après '+(i*6)+' défis. Continue ton parcours !')}});$$('[data-node]').forEach(b=>b.onclick=()=>{let n=state.chosenWorld*6+(+b.dataset.node);if(n<=state.completed){setPage('train')}else alert('Niveau verrouillé : termine les étapes précédentes !')});$('#startMap')?.addEventListener('click',()=>setPage('train'));$$('[data-start]').forEach(b=>b.onclick=()=>startSession(b.dataset.start));$('#quit')?.addEventListener('click',()=>{if(confirm('Quitter la séance ? Elle ne sera pas enregistrée.'))setPage('train')});$('#play')?.addEventListener('click',()=>{if(running){stopTimer();render()}else startTimer()});$('#next')?.addEventListener('click',nextExercise);$('#repeatVoice')?.addEventListener('click',()=>{unlockSound();speak(currentExercise().cue)});$('#backMap')?.addEventListener('click',()=>setPage('map'));$('#backTrain')?.addEventListener('click',()=>setPage('train'));$$('[data-coach]').forEach(b=>b.onclick=()=>{let c=coaches.find(x=>x.id===b.dataset.coach);alertText='';if(state.owned.includes(c.id)){state.coach=c.id;save();render();return}if(state.coins<c.cost){alertText='Il te manque '+(c.cost-state.coins)+' pièces pour débloquer '+c.name+'.';render();return}if(confirm('Débloquer '+c.name+' pour '+c.cost+' pièces virtuelles ?')){state.coins-=c.cost;state.owned.push(c.id);state.coach=c.id;save();render()}});$$('[data-day]').forEach(b=>b.onclick=()=>{let d=+b.dataset.day;if(state.clubDays.includes(d))state.clubDays=state.clubDays.filter(x=>x!==d);else if(state.clubDays.length<4)state.clubDays.push(d);save();render()});$('#competition')?.addEventListener('change',e=>{state.competition=e.target.value;save()});$('#sound')?.addEventListener('click',()=>{state.volume=!state.volume;save();render()});$('#voiceTest')?.addEventListener('click',()=>{unlockSound();speak('Salut ! Je suis '+activeCoach().name+', ton coach sportif. Prépare-toi pour l’aventure !')})}
$$('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
